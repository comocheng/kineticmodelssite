  title: "The chemistry of fire,"
  title_highlight: "open to all who study it."
  lede: "Prometheus keeps kinetic models and experimental data in one database. Both use the same identity for each molecule. Thus, you can test a model against the experiments that it describes, and keep the result on record."
  actions:
