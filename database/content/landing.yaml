# Copy for the home page (database/templates/database/home.html).
#
# Change the words here. The template only lays them out, and the tests in
# database/tests/test_landing_unit.py check this file after each change.
#
# Rules for this file:
# - Put every value in double quotes. YAML 1.1 reads a bare No, Yes, On or Off
#   as true or false.
# - "url" is a Django URL name, for example "species-search". "href" is a path
#   or a full address. Give one of the two.
# - A word in braces, for example {models}, is a live number from the database.
#   database/services/landing.py lists the keys. The tests fail on an unknown key.
# - The text is public, so it follows ASD-STE100 Simplified Technical English:
#   at most 25 words in a sentence, active voice, no -ing verb forms.
# - The name of the project is "Prometheus". "Pr.omethe.us" is only the
#   wordmark and the web address.

meta:
  title: "Prometheus: open cyberinfrastructure for combustion kinetics"
  description: "Prometheus keeps kinetic models and experimental data for combustion in one open database, with the same identity for each molecule on both sides."

hero:
  eyebrow: "Open cyberinfrastructure for combustion kinetics"
  title: "The chemistry of fire,"
  title_highlight: "open to all who study it."
  lede: "Prometheus keeps kinetic models and experimental data in one database. Both use the same identity for each molecule. Thus, you can test a model against the experiments that it describes, and keep the result on record."
  actions:
    - label: "Explore kinetic models"
      url: "kinetic-model-list"
      style: "primary"
    - label: "Read the API documentation"
      url: "swagger-ui"
      style: "ghost"
  note: "Read access through the API is public. You do not need an account to read data."
  # Shown under the 3D flame, which releases these species as rising labels
  flame_note: "Each name that rises from the flame is one of the {flame_species} species that the most models in Prometheus use."

