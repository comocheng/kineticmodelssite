events {}

http {
    upstream kms {
        server web:8000;
    }

    server {
        listen 80;

        location / {
            proxy_pass http://kms;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Host $http_host;
            proxy_redirect off;
        }

        location /static/ {
            alias /app/static/;
        }

        location /media/ {
            alias /app/media/;
        }

        # Self-hosted documentation site (built by the web container's entrypoint
        # into the shared static volume at /app/static/docs/).
        location /docs/ {
            alias /app/static/docs/;
            index index.html;
        }
    }
}
