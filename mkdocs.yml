site_name: Pr.omethe.us
site_description: Kinetic Models Database — FAIR combustion-kinetics platform usage guide and API reference
site_url: https://pr.omethe.us/docs/
repo_url: https://github.com/comocheng/kineticmodelssite
# The NSF acknowledgment and disclaimer of the site footer, in the footer of each guide page
copyright: >-
  This material is based upon work supported by the National Science Foundation under Grant Nos.
  <a href="https://www.nsf.gov/awardsearch/show-award/?AWD_ID=1403171">1403171</a>,
  <a href="https://www.nsf.gov/awardsearch/show-award/?AWD_ID=2531937">2531937</a>, and
  <a href="https://www.nsf.gov/awardsearch/show-award/?AWD_ID=2531938">2531938</a>.
  Any opinions, findings, and conclusions or recommendations expressed in this material are those of the
  author(s) and do not necessarily reflect the views of the National Science Foundation.
docs_dir: docs
site_dir: docs_site
use_directory_urls: false

theme:
  name: material
  logo: assets/prometheus-logo.png
  favicon: assets/favicon.ico
  font:
    text: Inter
    code: IBM Plex Mono
  palette:
    # Colors are set in stylesheets/extra.css to match the main site (#ce4801).
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - content.code.copy
    - content.code.annotate
    - search.suggest
    - toc.follow

extra:
  # The logo goes back to the site, which serves this guide at /docs/
  homepage: /

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  # The use-case pages include their scripts and results from docs/use-cases/
  - pymdownx.snippets:
      base_path: [docs/use-cases]
      check_paths: true

plugins:
  - search

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Species search: species-search.md
  - Thermochemistry sources: thermochemistry.md
  - Comparing chemistry: chemistry-comparison.md
  - Authentication: authentication.md
  - API guide:
      - Overview: api/overview.md
      - Filtering & search: api/filtering.md
      - Relationships & complex queries: api/relationships.md
      - Experimental data: api/experimental-data.md
      - Kinetic models & species: api/kinetic-models.md
      - Analysis & agreement: api/analysis.md
      - Provenance & FAIR metadata: api/provenance.md
      - Canonical URLs: api/canonical-urls.md
  - Examples:
      - cURL: examples/curl.md
      - Python: examples/python.md
      - R: examples/r.md
      - MATLAB: examples/matlab.md
      - JavaScript: examples/javascript.md
      - Java: examples/java.md
  - Use cases:
      - Overview: use-cases/index.md
      - "1. Find a species by its structure": use-cases/uc01.md
      - "2. Compare the enthalpy of formation with ATcT": use-cases/uc02.md
      - "3. Compare the heat capacity of one species": use-cases/uc03.md
      - "4. Find the species that models disagree on": use-cases/uc04.md
      - "5. Compare one rate coefficient in all models": use-cases/uc05.md
      - "6. Find the rate expressions that models share": use-cases/uc06.md
      - "7. Compare the pressure dependence of a rate coefficient": use-cases/uc07.md
      - "8. List the reactions of one species in one model": use-cases/uc08.md
      - "9. Find the models that contain two species": use-cases/uc09.md
      - "10. Simulate a dataset with a model in PyTeCK": use-cases/uc10.md
      - "11. Map the conditions of the experiments": use-cases/uc11.md
      - "12. Collect the ignition delays of one fuel": use-cases/uc12.md
      - "13. Compare the burning velocities of several laboratories": use-cases/uc13.md
      - "14. Plot the species profiles of one experiment": use-cases/uc14.md
      - "15. Join the experiments and the models of a fuel": use-cases/uc15.md
      - "16. Find the models that were built from the same parts": use-cases/uc16.md
      - "17. Find the experiments that discriminate between models": use-cases/uc17.md
      - "18. Find the reactions that make two models differ": use-cases/uc18.md
  - Client SDKs: clients.md
  - API reference: reference.md
  - Contributing data: contributing-data.md
